name: QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Static QA and BATS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Static checks
        run: bash scripts/qa/static.sh

      - name: BATS tests
        run: bats tests
