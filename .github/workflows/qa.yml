name: QA

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Static QA and BATS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck jq

      - name: Install pinned actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          mkdir -p "${RUNNER_TEMP}/actionlint"
          archive="${RUNNER_TEMP}/actionlint/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          echo "${RUNNER_TEMP}/actionlint" >>"${GITHUB_PATH}"

      - name: Static checks
        run: bash scripts/qa/static.sh

      - name: BATS tests
        run: bats tests

  xray:
    name: Xray ${{ matrix.version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version:
          - 1.8.24
          - 26.2.6

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download Xray
        env:
          XRAY_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/xray"
          curl --fail --location --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" \
            --output "${RUNNER_TEMP}/xray.zip"
          unzip -q "${RUNNER_TEMP}/xray.zip" -d "${RUNNER_TEMP}/xray"
          chmod +x "${RUNNER_TEMP}/xray/xray"

      - name: Validate Mors VLESS template
        env:
          XRAY_VERSION: ${{ matrix.version }}
        run: bash scripts/qa/xray-compatibility.sh "${RUNNER_TEMP}/xray/xray" "${XRAY_VERSION}"
