name: Router Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type install-mors-passive to verify a passive package installation on the configured test router.
        required: true
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Build package
    if: ${{ inputs.confirm == 'install-mors-passive' }}
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read
      packages: write

  smoke:
    name: Smoke on router
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ inputs.confirm == 'install-mors-passive' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mors-ipk
          path: packages

      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Configure SSH key
        env:
          ROUTER_SSH_KEY: ${{ secrets.MORS_ROUTER_SSH_KEY }}
        run: |
          test -n "${ROUTER_SSH_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${ROUTER_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Router smoke
        env:
          ROUTER_HOST: ${{ secrets.MORS_ROUTER_HOST }}
          ROUTER_USER: ${{ secrets.MORS_ROUTER_USER }}
          ROUTER_PORT: ${{ secrets.MORS_ROUTER_PORT }}
          MORS_ROUTER_SMOKE_CONFIRM: install-mors-passive
        run: |
          export ROUTER_USER="${ROUTER_USER:-root}"
          export ROUTER_PORT="${ROUTER_PORT:-22}"
          export IPK_PATH="$(find packages -maxdepth 1 -type f -name 'mors_*_all.ipk' | head -n 1)"
          bash scripts/qa/router-smoke.sh
