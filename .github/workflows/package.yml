name: Entware Package

on:
  workflow_call:
    outputs:
      builder_image:
        description: Immutable Entware builder image used for the package.
        value: ${{ jobs.builder.outputs.image }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builder:
    name: Resolve Entware builder
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    concurrency:
      group: entware-builder-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve or publish immutable builder
        id: resolve
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          builder_id="$(bash scripts/qa/entware-builder-id.sh)"
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mors-entware-builder"
          image_tag="${image_name}:v1-${builder_id}"

          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          resolve_digest() {
            docker buildx imagetools inspect "${image_tag}" 2>/dev/null |
              awk '$1 == "Digest:" { print $2; exit }'
          }

          image_digest="$(resolve_digest || true)"
          if [ -z "${image_digest}" ]; then
            for attempt in 1 2 3; do
              if docker buildx build \
                --file builder/entware/Dockerfile \
                --platform linux/amd64 \
                --build-arg "BUILDER_ID=${builder_id}" \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --tag "${image_tag}" \
                --push \
                .
              then
                break
              fi

              image_digest="$(resolve_digest || true)"
              [ -n "${image_digest}" ] && break
              if [ "${attempt}" -eq 3 ]; then
                echo "Unable to publish Entware builder after ${attempt} attempts." >&2
                exit 1
              fi
              echo "Entware builder attempt ${attempt} failed; retrying." >&2
              sleep $((attempt * 10))
            done
            for attempt in 1 2 3 4 5; do
              image_digest="$(resolve_digest || true)"
              [ -n "${image_digest}" ] && break
              sleep 3
            done
          fi

          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve immutable Entware builder digest for ${image_tag}." >&2
            exit 1
          fi

          image="${image_name}@${image_digest}"
          printf 'image=%s\n' "${image}" >>"${GITHUB_OUTPUT}"
          {
            printf '### Entware builder\n\n'
            printf -- '- ID: `%s`\n' "${builder_id}"
            printf -- '- Image: `%s`\n' "${image}"
          } >>"${GITHUB_STEP_SUMMARY}"

  build:
    name: Build .ipk
    needs: builder
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.builder.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify immutable builder
        run: bash scripts/qa/verify-entware-builder.sh

      - name: Build package
        run: bash scripts/qa/entware-build.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mors-ipk
          path: packages/mors_*_all.ipk
          if-no-files-found: error
