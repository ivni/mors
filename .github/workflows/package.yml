name: Entware Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build .ipk
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Entware build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            curl \
            file \
            gawk \
            g++-multilib \
            gcc-multilib \
            genisoimage \
            git \
            jq \
            libdw-dev \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            locales \
            python-is-python3 \
            python3 \
            python3-pip \
            qemu-utils \
            rsync \
            signify-openbsd \
            subversion \
            swig \
            unzip \
            wget \
            zstd
          python3 -m pip install --user pyelftools pyOpenSSL service_identity

      - name: Build package
        run: bash scripts/qa/entware-build.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mors-ipk
          path: packages/mors_*_all.ipk
          if-no-files-found: error
