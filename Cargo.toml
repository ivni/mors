[workspace]
members = ["crates/domain", "crates/adapters", "crates/platform", "crates/coordinator", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace.dependencies]
mors-domain = { path = "crates/domain" }
mors-adapters = { path = "crates/adapters" }
mors-platform = { path = "crates/platform" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
